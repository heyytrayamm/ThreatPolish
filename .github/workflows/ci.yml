name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint for correctness errors
        working-directory: backend
        run: ruff check app tests scripts --select F,E9
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: threatpolish
          POSTGRES_PASSWORD: threatpolish
          POSTGRES_DB: threatpolish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatpolish -d threatpolish_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TP_TEST_DB_URL: postgresql+psycopg://threatpolish:threatpolish@localhost:5432/threatpolish_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  dashboard-e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-browser.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        working-directory: backend
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install chromium
      - name: Build the dashboard
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Drive the password flow in a browser
        working-directory: backend
        run: python -m pytest tests/test_browser.py -q

  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t threatpolish:ci .
