name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint for correctness errors
        working-directory: backend
        run: ruff check app tests scripts --select F,E9
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: threatpolish
          POSTGRES_PASSWORD: threatpolish
          POSTGRES_DB: threatpolish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatpolish -d threatpolish_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TP_TEST_DB_URL: postgresql+psycopg://threatpolish:threatpolish@localhost:5432/threatpolish_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Assert retention maintenance and viewer denial on PostgreSQL
        working-directory: backend
        run: python -m pytest tests/test_retention.py -q

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-browser.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt -r requirements-browser.txt
      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit dashboard dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  dashboard-e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-browser.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        working-directory: backend
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install chromium
      - name: Build the dashboard
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Drive the password flow in a browser
        working-directory: backend
        run: python -m pytest tests/test_browser.py -q

  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t threatpolish:ci .

  compose-demo:
    name: Demo Compose overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare demo environment
        run: |
          cp .env.example .env
          sed -i 's|^TP_ENV=.*|TP_ENV=development|' .env
          sed -i 's|^TP_DB_PASSWORD=.*|TP_DB_PASSWORD=ci-demo-database-password|' .env
          sed -i 's|^TP_DB_URL=.*|TP_DB_URL=postgresql+psycopg://threatpolish:ci-demo-database-password@db:5432/threatpolish|' .env
          sed -i 's|^TP_JWT_SECRET=.*|TP_JWT_SECRET=ci-demo-signing-secret-that-is-long-enough|' .env
      - name: Start the demo stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
      - name: Wait for the seed to finish
        run: |
          for attempt in $(seq 1 90); do
            state=$(docker inspect -f '{{.State.Status}}' threatpolish-seed-1 2>/dev/null || true)
            if [ "$state" = "exited" ]; then break; fi
            sleep 2
          done
          docker inspect -f 'seed status={{.State.Status}} exit={{.State.ExitCode}}' threatpolish-seed-1
          test "$(docker inspect -f '{{.State.ExitCode}}' threatpolish-seed-1)" = "0"
      - name: Assert the seed created data and a login
        run: |
          events=$(docker compose -f docker-compose.yml -f docker-compose.demo.yml exec -T db \
            psql -U threatpolish -d threatpolish -tAc "SELECT count(*) FROM events")
          login=$(docker compose -f docker-compose.yml -f docker-compose.demo.yml exec -T db \
            psql -U threatpolish -d threatpolish -tAc \
            "SELECT count(*) FROM users WHERE email = 'demo@threatpolish.local'")
          echo "seeded events: $events"
          echo "demo logins: $login"
          test "$events" -gt 0
          test "$login" = "1"
      - name: Run the seed again and assert idempotency
        run: |
          counts() {
            docker compose -f docker-compose.yml -f docker-compose.demo.yml exec -T db \
              psql -U threatpolish -d threatpolish -tAc \
              "SELECT (SELECT count(*) FROM events) || ' ' || (SELECT count(*) FROM users) || ' ' || (SELECT count(*) FROM retention_runs)"
          }
          before=$(counts)
          second=$(docker compose -f docker-compose.yml -f docker-compose.demo.yml \
            run --rm --no-deps seed 2>&1)
          echo "$second" | tail -8
          grep -q "Demo data already present:" <<<"$second"
          after=$(counts)
          echo "before: $before"
          echo "after:  $after"
          test "$before" = "$after"
      - name: Show seed logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs seed
      - name: Stop the demo stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
