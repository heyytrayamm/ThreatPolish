name: threatpolish

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatpolish
      POSTGRES_USER: threatpolish
      POSTGRES_PASSWORD: ${TP_DB_PASSWORD:?set TP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatpolish -d threatpolish"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

