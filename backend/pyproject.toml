[project]
name = "threatpolish"
version = "1.0.0"
description = "Evidence-guided campaign correlation with uncertainty-aware adaptive deception"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
