[project]
name = "threatpolish"
version = "2.0.1"
description = "Evidence-guided campaign correlation with uncertainty-aware adaptive deception"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "sqlalchemy>=2.0.52,<2.1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<3.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
